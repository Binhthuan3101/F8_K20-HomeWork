<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <title>Spotify - Profile</title>
  </head>
  <body class="p-6 bg-black text-white min-h-screen font-sans">
    <!-- Header Navbar -->
    <header
      class="flex justify-between items-center mb-8 pb-4 border-b border-gray-800"
    >
      <a
        href="index.html"
        class="text-2xl font-bold text-green-500 hover:opacity-90"
      >
        ← Trang chủ
      </a>
      <button
        id="btn-logout"
        class="bg-red-500 hover:bg-red-600 px-4 py-1.5 rounded text-sm font-semibold cursor-pointer"
      >
        Đăng xuất
      </button>
    </header>

    <!-- Main Container -->
    <main
      class="max-w-xl mx-auto bg-gray-900 p-6 sm:p-8 rounded-xl border border-gray-800 shadow-xl"
    >
      <h1
        class="text-2xl font-bold text-green-400 mb-6 pb-2 border-b border-gray-800"
      >
        Thông tin cá nhân
      </h1>

      <div id="profile-container" class="space-y-6">
        <div class="animate-pulse text-gray-400 text-center py-8">
          Đang tải thông tin cá nhân...
        </div>
      </div>
    </main>
    <script>
      (async () => {
        const token = localStorage.getItem("access_token");

        let res = await fetch("https://spotify.f8team.dev/api/users/me", {
          method: "GET",
          headers: {
            Authorization: `Bearer ${token}`,
          },
        });

        let data = await res.json();
        console.log(data, "Dữ liệu");
      })();

      const logoutBtn = document.querySelector("#btn-logout");
      const profileContainer = document.querySelector("#profile-container");
      const token = localStorage.getItem("access_token");
      // 1. Kiểm tra Token đăng nhập
      if (!token) {
        alert("Bạn cần đăng nhập để xem thông tin");
        window.location.href = "./login.html";
      }

      // 2. Đăng xuất
      logoutBtn.addEventListener("click", () => {
        localStorage.clear();
        window.location.href = "./login.html";
      });

      // 3. Hàm Fetch kèm Token & tự động Refresh Token
      async function fetchWithToken(url) {
        let res = await fetch(url, {
          headers: {
            Authorization: `Bearer ${localStorage.getItem("access_token")}`,
          },
        });

        // Nếu Access Token hết hạn (401) => Xử lý Refresh Token
        if (res.status === 401) {
          const reFreshToken = localStorage.getItem("refresh_token");
          if (reFreshToken) {
            const rfRes = await fetch(
              "https://spotify.f8team.dev/api/auth/refresh-token",
              {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ refresh_token: reFreshToken }),
              },
            );
            const rfData = await rfRes.json();
            const newToken = rfData.access_token || rfData.data?.access_token;

            if (newToken) {
              localStorage.setItem("access_token", newToken);
              res = await fetch(url, {
                headers: { Authorization: `Bearer ${newToken}` },
              });
            } else {
              localStorage.clear();
              window.location.href = "./login.html";
            }
          } else {
            localStorage.clear();
            window.location.href = "./login.html";
          }
        }
        return res.json();
      }

      // 4. Lấy dữ liệu và hiển thị Profile
      async function loadUserProfile() {
        try {
          // Gọi thông qua fetchWithToken để đính kèm Header Authorization
          const responseData = await fetchWithToken(
            "https://spotify.f8team.dev/api/users/me",
          );

          // Bóc tách dữ liệu từ API
          const raw = responseData.data || responseData;
          const user = raw.user;
          if (!user || user.status === 404 || user.message === "Unauthorized") {
            profileContainer.innerHTML = `<p class="text-red-400 text-center">Không thể lấy thông tin người dùng</p>`;
            return;
          }

          const fallbackImg =
            "https://placehold.co/150/1e293b/ffffff?text=User";
          const avatarUrl =
            user.avatar || user.avatar_url || user.image_url || fallbackImg;

          const username =
            user.name || user.username || user.display_name || "Chưa cập nhật";
          const email = user.email || "Chưa cập nhật";

          const ignoreKeys = [
            "avatar",
            "avatar_url",
            "image_url",
            "name",
            "username",
            "full_name",
            "email",
          ];

          // Lọc các trường dữ liệu khác
          const otherFields = Object.entries(user).filter(
            ([key]) => !ignoreKeys.includes(key),
          );

          const otherFieldsHtml = otherFields
            .map(([key, value]) => {
              let displayValue = value;
              if (typeof value === "object" && value !== null) {
                displayValue = JSON.stringify(value);
              } else if (
                value === null ||
                value === undefined ||
                value === ""
              ) {
                displayValue = "Chưa có dữ liệu";
              }
              return `
                <div>
                    <label class="text-xs font-semibold text-gray-400 uppercase tracking-wider block mb-1">${key.replace(/_/g, " ")}</label>  
                    <div class="bg-gray-800 p-3 rounded border border-gray-700 text-sm break-words text-gray-200">${displayValue}</div>
                </div>
              `;
            })
            .join("");

          profileContainer.innerHTML = `
            <!-- Phần Avatar, Tên, Email -->
            <div class="flex flex-col sm:flex-row items-center gap-5 pb-6 border-b border-gray-800">
              <img 
                src="${avatarUrl}" 
                onerror="this.onerror=null; this.src='${fallbackImg}';" 
                class="w-24 h-24 rounded-full object-cover border-2 border-green-500 shadow-md"
                alt="Avatar"
              />
              <div class="text-center sm:text-left space-y-1">
                <h2 class="text-2xl font-bold text-white">${username}</h2>
                <p class="text-gray-400 text-sm">${email}</p>
              </div>
            </div>

            <!-- Các thông tin khác trong API trả về -->
            <div class="space-y-4">
              <div>
                <label class="text-xs font-semibold text-gray-400 uppercase tracking-wider block mb-1">Tên người dùng</label>
                <div class="bg-gray-800 p-3 rounded border border-gray-700 text-sm font-medium">${username}</div>
              </div>

              <div>
                <label class="text-xs font-semibold text-gray-400 uppercase tracking-wider block mb-1">Email</label>
                <div class="bg-gray-800 p-3 rounded border border-gray-700 text-sm font-medium">${email}</div>
              </div>

              ${otherFieldsHtml}
            </div>
          `;
        } catch (error) {
          console.error("Lỗi khi tải profile: ", error);
          profileContainer.innerHTML = `<p class="text-red-500 text-center">Đã xảy ra lỗi kết nối khi tải dữ liệu cá nhân!</p>`;
        }
      }

      loadUserProfile();
    </script>
  </body>
</html>
