<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Infinite Carousel- Day 26</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <script
      src="https://kit.fontawesome.com/ff53e92e9d.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body class="bg-slate-100 min-h-screen py-10 px-4">
    <div class="max-w-2xl mx-auto">
      <div
        id="slider"
        class="relative bg-slate-900 rounded-2xl shadow-xl overflow-hidden border border-slate-200 outline-none group"
        tabindex="0"
      >
        <div
          id="counter"
          class="absolute top-4 left-4 z-20 bg-black/50 backdrop-blur-md text-white text-xl font-semibold px-3 py-1 rounded-full shadow-sm"
        >
          1/5
        </div>

        <div id="track" class="flex">
          <!-- Js sẽ inject danh sách ảnh -->
        </div>

        <button id="prev-btn" class="absolute left-3 top-1/2 -translate-y-1/2 z-20 bg-black/30 hover:bg-black/60 text-white p-3 rounded-full transition backdrop-blur-sm"><i class="fa-solid fa-angle-left"></i></button>
        <button id="next-btn" class="absolute right-3 top-1/2 -translate-y-1/2 z-20 bg-black/30 hover:bg-black/60 text-white p-3 rounded-full transition backdrop-blur-sm"><i class="fa-solid fa-angle-right"></i></button>

        <div
          id="dots-container"
          class="absolute bottom-4 left-1/2 -translate-x-1/2 z-20 flex gap-2"
        ></div>
      </div>
    </div>
    <script src="./script.js"></script>
  </body>
</html>
