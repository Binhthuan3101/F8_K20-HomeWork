<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
      @layer base {
        .active {
          @apply text-blue-500;
        }
      }
    </style>
  </head>
  <body>
    <h1 class="text-2xl font-bold" draggable="true">Day 26</h1>
    <h2 class="text-xl font-bold">Event trong DOM</h2>
    <h3 class="text-lg">Event Object</h3>
    <ul class="event-method-list">
      <li>event.type</li>
      <li class="active">event.target</li>
      <li>event.currentTarget</li>
      <li>event.preventDefault</li>
      <li>event.stopPropagation</li>
    </ul>
    <div class="flex flex-col gap-3 m-3 border p-2 rounded-md border-gray-300">
      <h3>Form add user</h3>
      <form class="user-form flex flex-col" action="">
        <label>
          Name:
          <input
            class="user-input border rounded-md px-2 py-1"
            placeholder="Enter name..."
            type="text"
            name="username"
            id="name"
          />
        </label>

        <button
          type="submit"
          class="w-fit bg-blue-300 rounded-md px-3 py-2 text-white hover:brightness-110 hover:cursor-pointer"
        >
          Submit
        </button>
      </form>
    </div>
    <div
      class="flex flex-col gap-3 bg-blue-200 m-3 border p-2 rounded-md border-gray-300 max-w-3xl"
    >
      <h3 class="font-bold text-xl">Todo list:</h3>
      <div class="flex justify-between items-center">
        <div>
          <input type="checkbox" id="input-all" name="checkbox-all" />

          <label id="check-all" for="input-all" class="hover:cursor-pointer select-none">
            Chọn tất cả
          </label>
        </div>
        <div class="text-xs text-gray-500">
          <span id="checked-num">0</span>
          công việc được chọn
          <nav></nav>
        </div>
      </div>
      <ul >
        <li>
          <label class="mt-2 px-2 py-1 bg-blue-300 w-full block rounded-sm">
            <input class="input-todo" type="checkbox" />
            Todo1
          </label>
        </li>
        <li>
          <label class="mt-2 px-2 py-1 bg-blue-300 w-full block rounded-sm">
            <input class="input-todo" type="checkbox" />
            Todo2
          </label>
        </li>
        <li>
          <label class="mt-2 px-2 py-1 bg-blue-300 w-full block rounded-sm">
            <input class="input-todo" type="checkbox" />
            Todo3
          </label>
        </li>
      </ul>
    </div>

    <ul>
        <li>
            <input type="checkbox">
            <label for="">Tap 1</label>
        </li>
        <li>
            <input type="checkbox">
            <label for="">Tap 2</label>
        </li>
        <li>
            <input type="checkbox">
            <label for="">Tap 3</label>
        </li>
    </ul>
    <div class="">
        Content 1
    </div>
    <script src="script.js"></script>
  </body>
</html>
