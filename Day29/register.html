<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <div>
      <h1>Register</h1>
      <form action="" id="form-login" class="flex flex-col space-y-6">
        <input
          class="border border-gray-300 px-4 py-1 outline-none"
          name="username"
          placeholder="Username..."
          type="text"
        />
        <input
          class="border border-gray-300 px-4 py-1 outline-none"
          name="email"
          placeholder="Email..."
          type="email"
        />
        <input
          class="border border-gray-300 px-4 py-1 outline-none"
          type="password"
          name="password"
          placeholder="Password..."
          id="password"
        />
        <input
          class="border border-gray-300 px-4 py-1 outline-none"
          type="text"
          name="display-name"
          placeholder="Display Name..."
          id="display-name"
        />
        <input
          class="border border-gray-300 px-4 py-1 outline-none"
          type="text"
          name="bio"
          placeholder="Bio..."
          id="bio"
        />
        <select name="country" id="">
          <option value="VN">Việt Nam</option>
          <option value="EN">English</option>
        </select>
        <button
          class="w-full py-1 bg-blue-500 rounded-md text-white"
          type="submit"
        >
          Register
        </button>
      </form>
    </div>
    <script>
      const formLogin = document.querySelector("#form-login");
      formLogin.addEventListener("submit", (e) => {
        e.preventDefault();
        const data = Object.fromEntries(new FormData(e.target));
        fetch("https://spotify.f8team.dev/api/auth/register", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify(data),
        })
          .then((res) => res.json())
          .then((data) => {
            if (!data.error) {
              localStorage.setItem("access_token", data.access_token);
              localStorage.setItem("refresh_token", data.refresh_token);
              alert("Register success!")
              window.location.href = "./index.html";
            }
            else{
              alert(data.error?.message)
            }
          });
      });
    </script>
  </body>
</html>
