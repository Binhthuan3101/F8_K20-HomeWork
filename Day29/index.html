<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <h1>Day 29</h1>
    <div class="border  w-72 bg-blue-400 border-gray-300 p-4 rounded-lg">
      <h2 class="text-center text-xl mb-4">Login form</h2>
      <form action="" id="form-login" class="flex flex-col space-y-6">
        <input
          class="border border-gray-300 px-4 py-1 outline-none"
          name="email"
          placeholder="Email..."
          type="email"
        />
        <input
          class="border border-gray-300 px-4 py-1 outline-none"
          type="password"
          name="password"
          placeholder="Password..."
          id="password"
        />
        <button class="w-full py-1 bg-blue-500 rounded-md text-white" type="submit">Login</button>
      </form>
    </div>
    <script src="script.js"></script>
  </body>
</html>
