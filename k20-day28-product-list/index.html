<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script
      src="https://kit.fontawesome.com/ff53e92e9d.js"
      crossorigin="anonymous"
    ></script>
    <title>Danh sách sản phẩm</title>
  </head>
  <body class="min-h-screen bg-gray-950 text-white">
    <div class="container max-w-6xl w-full mx-auto shadow-2xl">
      <header class="px-6 py-4 bg-black border-b border-gray-800">
        <div class="rounded-xl space-x-4 flex items-center">
          <a
            class="inline-block py-1.5 text-base px-4 bg-transparent rounded-lg text-white font-bold hover:bg-gray-800 transition duration-300 border border-gray-700"
            href="./index.html"
          >
            Trang chủ
          </a>
          <a
            class="inline-block py-1.5 text-base px-4 bg-transparent rounded-lg text-white font-bold hover:bg-gray-800 transition duration-300 border border-transparent"
            href="./products-detail.html"
          >
            Chi tiết sản phẩm
          </a>
        </div>
      </header>
      <div class="p-6 mx-auto w-full bg-black min-h-[calc(100vh-73px)]">
        <h1 class="text-center mb-6 font-extrabold text-3xl text-purple-400 tracking-wide">
          DANH SÁCH SẢN PHẨM
        </h1>

        <div class="p-4 mb-6 bg-purple-950/40 border border-purple-900/50 rounded-xl flex flex-col md:flex-row gap-4 justify-between items-center">
          
          <div class="flex gap-2 w-full md:w-auto items-center">
            <label for="search" class="text-white text-sm font-bold whitespace-nowrap">
              Tìm kiếm:
            </label>
            <input
              class="bg-gray-900 text-white px-3 py-1.5 text-sm rounded-lg outline-none border border-purple-700 focus:border-purple-500 w-full md:w-64 transition"
              type="text"
              name="search"
              id="search"
              placeholder="Nhập tên sản phẩm..."
            />
            <button
              id="btn-search"
              class="flex justify-center rounded-lg bg-purple-700 hover:bg-purple-600 px-3 py-2 items-center text-sm text-white transition cursor-pointer"
            >
              <i class="fa-solid fa-magnifying-glass pointer-events-none"></i>
            </button>
          </div>

          <!-- Filter & Sort Options -->
          <div class="flex flex-wrap gap-3 w-full md:w-auto justify-end items-center">
            <!-- Category Filter -->
            <select
              id="category-filter"
              class="bg-purple-900 text-white px-3 py-1.5 rounded-lg border border-purple-700 text-sm outline-none cursor-pointer hover:bg-purple-800 transition"
            >
              <option value="">Tất cả danh mục</option>
            </select>

            <!-- Sort Select -->
            <select
              id="sort-select"
              class="bg-purple-900 text-white px-3 py-1.5 rounded-lg border border-purple-700 text-sm outline-none cursor-pointer hover:bg-purple-800 transition"
            >
              <option value="">Sắp xếp mặc định</option>
              <option value="price-asc">Giá: Thấp đến Cao</option>
              <option value="price-desc">Giá: Cao đến Thấp</option>
              <option value="title-asc">Tên: A - Z</option>
              <option value="title-desc">Tên: Z - A</option>
            </select>
          </div>
        </div>

        <!-- Loading & Error Status Container -->
        <div id="status-container" class="text-center py-10 hidden">
          <p id="status-text" class="text-lg text-purple-300 font-medium"></p>
        </div>

        <!-- Product Grid (Responsive: 1 col Mobile, 2 col Tablet, 3 col Desktop) -->
        <ul
          class="w-full p-4 bg-purple-950/30 border border-purple-900/30 rounded-xl grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6"
          id="products-list"
        ></ul>

        <!-- Pagination Controls -->
        <div id="pagination" class="flex justify-center items-center gap-4 mt-8 pb-4">
          <button
            id="btn-prev"
            class="px-4 py-2 bg-purple-900 hover:bg-purple-800 disabled:opacity-40 disabled:cursor-not-allowed text-white text-sm font-semibold rounded-lg transition border border-purple-700"
          >
            Trang trước
          </button>
          <span id="page-info" class="text-purple-200 text-sm font-semibold">Trang 1</span>
          <button
            id="btn-next"
            class="px-4 py-2 bg-purple-900 hover:bg-purple-800 disabled:opacity-40 disabled:cursor-not-allowed text-white text-sm font-semibold rounded-lg transition border border-purple-700"
          >
            Trang sau
          </button>
        </div>
      </div>
    </div>

    <script src="./script/app.js"></script>
  </body>
</html>
