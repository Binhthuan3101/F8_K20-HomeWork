<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <title>Chi tiết sản phẩm</title>

  <body>
    <div class="container bg-slate-900 max-w-2xl shadow-xl">
      <header class="bg-slate-800 shadow-md border-b border-slate-700">
      <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
        <a href="./index.html" class="text-xl font-bold text-purple-400 hover:text-purple-300 transition flex items-center gap-2">
          Cửa Hàng Sản Phẩm
        </a>
        <h1 class="text-lg font-semibold text-slate-300">Thông tin chi tiết</h1>
      </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-5xl mx-auto px-4 py-10">
      
      <!-- Khung chứa dữ liệu chi tiết sản phẩm (JS sẽ render vào đây) -->
      <div id="product-detail">
        <!-- Trạng thái Loading mặc định -->
        <div class="text-center py-20">
          <p class="text-lg text-purple-300 font-medium animate-pulse">
            Đang tải thông tin sản phẩm...
          </p>
        </div>
      </div>

    </main>

      <div></div>
    </div>
    <script src="./script/detail.js"></script>
