<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Chi tiết sản phẩm</title>
  </head>
  <body class="bg-slate-900 min-h-screen text-slate-100 flex flex-col font-sans antialiased">
    
    <header class="bg-slate-800 shadow-md border-b border-slate-700 sticky top-0 z-50">
      <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
        <a 
          href="./index.html" 
          class="text-xl font-bold text-purple-400 hover:text-purple-300 transition flex items-center gap-2 group"
        >
          <span class="group-hover:-translate-x-1 transition-transform inline-block">←</span> Cửa Hàng Sản Phẩm
        </a>
        <h1 class="text-sm md:text-base font-semibold text-slate-400">Thông tin chi tiết</h1>
      </div>
    </header>

    <main class="flex-grow max-w-6xl w-full mx-auto px-4 py-8 md:py-12">
      
      <div id="product-detail">
        <div class="flex flex-col items-center justify-center py-20 space-y-4">
          <div class="w-10 h-10 border-4 border-purple-500 border-t-transparent rounded-full animate-spin"></div>
          <p class="text-lg text-purple-300 font-medium animate-pulse">
            Đang tải thông tin sản phẩm...
          </p>
        </div>
      </div>

    </main>

    <footer class="bg-slate-800 border-t border-slate-700 py-4 text-center text-xs text-slate-400">
      © Cửa hàng sản phẩm - Tất cả quyền được bảo lưu.
    </footer>

    <script src="./script/detail.js"></script>
  </body>
</html>
