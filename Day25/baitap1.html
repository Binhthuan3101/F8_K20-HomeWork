<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bài tập 1</title>
    <script
      src="https://kit.fontawesome.com/ff53e92e9d.js"
      crossorigin="anonymous"
    ></script>
    <style>
      input {
        outline: none;
        border-radius: 12px;
        padding: 5px 10px;
      }

      input:focus {
        border: 2px solid purple;

      }
      .delete-btn {
        background-color: transparent;
        font-size: 13px;
        border: none;
      }
      #add-btn{
        padding: 6px 8px;
        border-radius: 10px;
        outline: 1px solid purple;
        border:  1px solid #fff;
        background: purple;
        color: #fff;
        font-weight: 400;
        margin-left: 20px;
        transition: all 0.3 ease;
        cursor: pointer;
      }
      #add-btn:hover{
        opacity: 0.7;
      }
    </style>
  </head>
  <body>
    <div id="todo-app">
      <input type="text" id="todo-input" placeholder="Nhập việc cần làm..." />
      <button id="add-btn">Thêm</button>
      <ul id="todo-list"></ul>
      <p id="todo-count">Còn 0 việc chưa xong</p>
    </div>

    <script src="baitap1.js"></script>
  </body>
</html>
